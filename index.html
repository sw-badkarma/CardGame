<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>Card RPG Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ECRAN LOBBY MULTIPLAYER -->
  <div class="overlay" id="lobby-overlay">
    <div class="modal lobby-modal">
      <h2>Card RPG Multiplayer</h2>
      <p>Joacă împotriva unui prieten în timp real!</p>
      
      <div class="lobby-actions">
        <button class="btn-primary" id="btn-create-room">Creează Cameră Nouă</button>
        <div class="divider">sau</div>
        <div class="join-box">
          <input type="text" id="room-code-input" placeholder="Cod Cameră (ex: 4921)" maxlength="4">
          <button class="btn-primary" id="btn-join-room">Intră</button>
        </div>
      </div>
      <div class="lobby-status" id="lobby-status"></div>
    </div>
  </div>

  <!-- ECRAN JOC -->
  <div class="game-container hidden" id="game-container">
    
    <header class="top-bar">
      <div class="char-hud player-hud">
        <div class="hud-header">
          <span class="char-name" id="p1-name">Tu (P1)</span>
        </div>
        <div class="hud-stats">
          <span class="stat-badge hp">❤️ <span id="p1-hp">80</span>/<span id="p1-max-hp">80</span></span>
          <span class="stat-badge shield">🛡️ <span id="p1-shield">0</span></span>
          <span class="stat-badge energy">⚡ <span id="p1-energy">3</span>/3</span>
        </div>
      </div>

      <div class="char-hud enemy-hud">
        <div class="hud-header">
          <span class="char-name" id="p2-name">Adversar (P2)</span>
        </div>
        <div class="hud-stats">
          <span class="stat-badge hp">❤️ <span id="p2-hp">80</span>/<span id="p2-max-hp">80</span></span>
          <span class="stat-badge shield">🛡️ <span id="p2-shield">0</span></span>
        </div>
      </div>
    </header>

    <main class="battle-arena" id="arena">
      <div class="avatar player-avatar" id="player-avatar">🧙‍♂️</div>
      <div class="vs-badge">ROOM: <span id="room-id-display">----</span></div>
      <div class="avatar enemy-avatar" id="enemy-avatar">🥷</div>
    </main>

    <div class="combat-log" id="combat-log">Așteptare conectare jucători...</div>

    <div class="controls-bar">
      <div class="deck-counter">🎴 In: <span id="draw-count">0</span> | Out: <span id="discard-count">0</span></div>
      <button id="end-turn-btn" class="btn-end-turn">Termină Tura</button>
    </div>

    <footer class="hand-container" id="hand-container"></footer>

  </div>

  <!-- FIREBASE MODULAR SDKs -->
  <script type="module" src="script.js"></script>
</body>
</html>
